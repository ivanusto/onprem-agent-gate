name: check
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -W error -m unittest discover -s tests -v
      - run: shellcheck -s sh tests/smoke-gatectl.sh tests/smoke-mcp.sh tests/fixtures/fake-ssh tests/fixtures/fake-logger
      - run: sh tests/smoke-gatectl.sh
      - run: sh tests/smoke-mcp.sh
      - run: python3 -c "import json; json.load(open('tools.json')); json.load(open('config.json.example'))"
      - name: promtool
        run: |
          curl -fsSL -o p.tgz https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
          tar xzf p.tgz && sudo install -m 0755 prometheus-3.5.0.linux-amd64/promtool /usr/local/bin/promtool
          promtool check rules prometheus/agent.yml
          cd tests && promtool test rules rules_agent_test.yml
